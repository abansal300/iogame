# Render.com Blueprint
# This file configures automatic deployment on Render.com

services:
  # Web Service (combines client + server)
  - type: web
    name: fuel-io
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build --workspace=client
    startCommand: npm run start --workspace=server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
    healthCheckPath: /health
